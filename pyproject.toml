[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-data-quality-triage"
version = "0.1.0"
description = "Deterministic-first data quality triage with confidence-gated Jev decisions"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["ruff==0.13.2"]

[project.scripts]
jev-triage = "jev_triage.cli:main"

[tool.setuptools.package-data]
jev_triage = ["schema.sql"]

[tool.ruff]
line-length = 100
